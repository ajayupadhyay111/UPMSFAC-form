# UPMSF — full stack on one VPS, single command. Automatic HTTPS via Caddy container.
#   db    : SQL Server 2022 (Express)
#   app   : ASP.NET Core API + Blazor WASM client (single container)
#   caddy : reverse proxy + automatic HTTPS (Let's Encrypt) for your domain
#
# Usage:
#   1) cp .env.example .env   &&  edit DB_PASSWORD, JWT_KEY, DOMAIN, LETSENCRYPT_EMAIL
#   2) docker compose up -d --build

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Express"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Default: "Server=db;Database=UPMSF;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "${JWT_KEY}"
      FileStorage__Root: "/data/uploads"
    volumes:
      - uploads:/data/uploads
    expose:
      - "8080"            # internal only — reached by caddy over the docker network
    depends_on:
      - db
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mssql-data:
  uploads:
  caddy-data:
  caddy-config:
